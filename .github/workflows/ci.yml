name: CI

# Comprobaciones rápidas en cada push y pull request (no compila el EXE).
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Pyflakes
        run: pyflakes main.py src tests

      - name: Tests
        run: python -m unittest discover -s tests -t . -v
